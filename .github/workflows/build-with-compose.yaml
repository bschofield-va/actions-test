name: Build with Docker Compose
on:
  workflow_call:
    inputs:
      #      compose-file:
      #        description: 'The Docker compose file to use to build images'
      #        type: string
      #        required: false
      #        default: compose.yaml
      timeout-minutes:
        description: 'Number of minutes build is allowed to run before aborting'
        type: number
        required: false
        default: 30
      release:
        description: 'Set true to perform a release build and publish artifacts'
        type: boolean
        required: false
        default: false
      container-registry-hostname:
        description: 'The container registry hostname.'
        type: string
        required: true
      compose-service-mount-cache-targets:
        description: 'List of Docker compose services and RUN mount cache targets, one pair per line'
        type: string
        required: false
    secrets:
      compose-env:
        description: 'Docker compose env file content'
        required: true
      container-registry-username:
        description: 'The container registry username when pushing images'
        required: true
      container-registry-password:
        description: 'The container registry password when pushing images'
        required: true
      app-client-id:
        description: 'Application client ID'
        required: true
      app-private-key:
        description: 'Application private key'
        required: true

jobs:
  build-with-compose:
    name: Build with Compose
    timeout-minutes: ${{ inputs.timeout-minutes }}
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
      - run: |
          echo "GITHUB_TOKEN=${{ steps.app-token.outputs.token }}" >> $GITHUB_ENV
          echo "GH_TOKEN=${{ steps.app-token.outputs.token }}" >> $GITHUB_ENV
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}
#      - name: Authenticate as app
#        run: |
#          JWT=$(.github/workflows/app-jwt)
#          echo ${{ github.api_url }}
#          INSTALLATION_ID=$(curl -sf ${{ github.api_url }}/repos/${{ github.repository }}/installation \
#            -H "Accept: application/vnd.github+json" \
#            -H "X-GitHub-Api-Version: 2022-11-28" \
#            -H "Authorization: Bearer $JWT" \
#            | jq -r '.id')
#          echo "Installation: $INSTALLATION_ID"
#          curl -sf -X POST ${{ github.api_url }}/app/installations/$INSTALLATION_ID/access_tokens \
#            -H "Accept: application/vnd.github+json" \
#            -H "X-GitHub-Api-Version: 2022-11-28" \
#            -H "Authorization: Bearer $JWT" \
#            -o token.json
#          jq '.expires_at' token.json
#          jq '.permissions' token.json
#        env:
#          APP_CLIENT_ID: ${{ secrets.app-client-id }}
#          APP_PRIVATE_KEY: ${{ secrets.app-private-key }}
#      - name: Get GitHub App User ID
#        id: get-user-id
#        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
#        env:
#          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Configure git
        run: |
          APP_USER_ID=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)"
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${APP_USER_ID}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
#      - name: Configure git
#        run: |
#          git config user.name "github-actions"
#          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Push test
        run: |
          date > .last-build-run
          git add .last-build-run
          git commit -m "action $(date)"
          git push
      - uses: docker/setup-buildx-action@v3
      - uses: actions/cache@v4
        with:
          path: /tmp/docker-build-cache
          key: docker-build-cache-${{ github.sha }}
          restore-keys: docker-build-cache-
      - name: Docker login ${{ inputs.container-registry-hostname }}
        run: echo "${{ secrets.container-registry-password }}" | docker login ${{ inputs.container-registry-hostname }} -u ${{ secrets.container-registry-username }} --password-stdin
      - name: Set compose environment
        run: echo "${{ secrets.compose-env }}" > .env
      - name: Import run mount caches
        run: echo "${{ inputs.compose-service-mount-cache-targets }}" | .github/workflows/run-mount-cache each-service --action import-cache
        if: ${{ inputs.compose-service-mount-cache-targets }}
      - name: Build
        run: .github/workflows/build.sh build
      - name: Release
        run: .github/workflows/build.sh release
        if: ${{ inputs.release }}
      - name: Export run mount caches
        run: echo "${{ inputs.compose-service-mount-cache-targets }}" | .github/workflows/run-mount-cache each-service --action export-cache
        if: ${{ inputs.compose-service-mount-cache-targets }}

