name: Release Prep

permissions:
  contents: write
  actions: read

on:
  pull_request:
    types: [closed]
    branches:
      - main

concurrency:
  group: release-prep-main
  cancel-in-progress: false

jobs:
  release-prep:
    name: Release Prep
    if: ${{ github.event.pull_request.merged == true && !startsWith(github.event.pull_request.head.ref, 'release-') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BASE_BRANCH: main
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BASE_BRANCH }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release commit and tag
        id: release
        run: |
          set -euo pipefail
          TIMESTAMP="$(date -u +%Y%m%d%H%M)"
          BRANCH="release-${TIMESTAMP}"
          TAG="${BRANCH}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          git checkout -B "${BRANCH}"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last-build-run
          git add .last-build-run
          git commit -m "chore(release): prepare ${BRANCH}"

          if git rev-parse "${TAG}" >/dev/null 2>&1 || gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Release tag already exists: ${TAG}" >&2
            exit 1
          fi

          git tag "${TAG}"
          git push --force-with-lease origin "${BRANCH}"
          git push origin "${TAG}"

      - name: Dispatch build workflow
        run: |
          gh workflow run build.yaml --ref "${{ steps.release.outputs.branch }}"

      - name: Dispatch CodeQL workflow
        run: |
          gh workflow run codeql.yaml --ref "${{ steps.release.outputs.branch }}"

      - name: Wait for build and CodeQL
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          set -euo pipefail
          sleep 8
          BUILD_RUN_ID="$(gh run list --workflow build.yaml --branch "${BRANCH}" --event workflow_dispatch --json databaseId,createdAt --jq 'sort_by(.createdAt) | last | .databaseId')"
          CODEQL_RUN_ID="$(gh run list --workflow codeql.yaml --branch "${BRANCH}" --event workflow_dispatch --json databaseId,createdAt --jq 'sort_by(.createdAt) | last | .databaseId')"

          if [ -z "${BUILD_RUN_ID}" ] || [ "${BUILD_RUN_ID}" = "null" ]; then
            echo "Unable to find dispatched build.yaml run for ${BRANCH}" >&2
            exit 1
          fi
          if [ -z "${CODEQL_RUN_ID}" ] || [ "${CODEQL_RUN_ID}" = "null" ]; then
            echo "Unable to find dispatched codeql.yaml run for ${BRANCH}" >&2
            exit 1
          fi

          wait_for_run() {
            local run_id="$1"
            local name="$2"
            local status=""
            local conclusion=""
            local attempts=0
            local max_attempts=120
            while true; do
              status="$(gh run view "${run_id}" --json status --jq '.status')"
              if [ "${status}" = "completed" ]; then
                conclusion="$(gh run view "${run_id}" --json conclusion --jq '.conclusion')"
                if [ "${conclusion}" != "success" ]; then
                  echo "${name} run ${run_id} completed with conclusion=${conclusion}" >&2
                  return 1
                fi
                echo "${name} run ${run_id} succeeded"
                return 0
              fi
              attempts=$((attempts+1))
              if [ "${attempts}" -ge "${max_attempts}" ]; then
                echo "Timed out waiting for ${name} run ${run_id}" >&2
                return 1
              fi
              sleep 10
            done
          }

          wait_for_run "${BUILD_RUN_ID}" "Build"
          wait_for_run "${CODEQL_RUN_ID}" "CodeQL"

      - name: Merge release commit to main
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch origin "${BASE_BRANCH}" "${BRANCH}"
          git checkout -B "${BASE_BRANCH}" "origin/${BASE_BRANCH}"
          git merge --no-ff --no-edit "origin/${BRANCH}"
          git push origin "${BASE_BRANCH}"
