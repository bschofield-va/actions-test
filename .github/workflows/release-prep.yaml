name: Release Prep

permissions:
  contents: write
  security-events: write

on:
  pull_request:
    types: [closed]
    branches:
      - main

concurrency:
  group: release-prep-main
  cancel-in-progress: false

jobs:
  release-prep:
    name: Release Prep
    if: ${{ github.event.pull_request.merged == true && !startsWith(github.event.pull_request.head.ref, 'release-') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BASE_BRANCH: main
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BASE_BRANCH }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare release commit and tag
        id: release
        run: |
          set -euo pipefail
          TIMESTAMP="$(date -u +%Y%m%d%H%M)"
          TAG="release-${TIMESTAMP}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last-build-run

          git add .last-build-run
          git commit -m "chore(release): prepare ${TAG}"

          if git rev-parse "${TAG}" >/dev/null 2>&1 || gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Release tag already exists: ${TAG}" >&2
            exit 1
          fi

          git tag "${TAG}"

      - name: CodeQL init
        uses: github/codeql-action/init@v4
        with:
          languages: actions

      - name: Build
        run: .github/workflows/build.sh build


      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v4

      - name: Push release commit and tag to main
        run: |
          set -euo pipefail
          git push origin HEAD:main
          git push origin "${{ steps.release.outputs.tag }}"
