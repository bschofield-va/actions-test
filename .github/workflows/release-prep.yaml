name: Release Prep

permissions:
  contents: write
  security-events: write

on:
  pull_request:
    types: [closed]
    branches:
      - main

concurrency:
  group: release-prep-main
  cancel-in-progress: false

jobs:
  release-prep:
    name: Release Prep
    if: ${{ github.event.pull_request.merged == true && !startsWith(github.event.pull_request.head.ref, 'release-') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BASE_BRANCH: main
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BASE_BRANCH }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release branch, commit and tag
        id: release
        run: |
          set -euo pipefail
          TIMESTAMP="$(date -u +%Y%m%d%H%M)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          BRANCH="release-${SHORT_SHA}"
          TAG="release-${TIMESTAMP}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          git checkout -B "${BRANCH}"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last-build-run
          git add .last-build-run
          git commit -m "chore(release): prepare ${TAG}"

          if git rev-parse "${TAG}" >/dev/null 2>&1 || gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Release tag already exists: ${TAG}" >&2
            exit 1
          fi

          git tag "${TAG}"
          git push --force-with-lease origin "${BRANCH}"
          git push origin "${TAG}"

      - name: Build
        run: .github/workflows/build.sh build

      - name: CodeQL init
        uses: github/codeql-action/init@v4
        with:
          languages: actions

      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v4

      - name: Merge release branch to main
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch origin "${BASE_BRANCH}"
          git checkout -B "${BASE_BRANCH}" "origin/${BASE_BRANCH}"
          git merge --no-ff --no-edit "origin/${BRANCH}"
          git push origin "${BASE_BRANCH}"
