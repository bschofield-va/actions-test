name: PR Build

permissions:
  contents: read
  packages: read

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: .github/workflows/build.sh build
