name: Release Build and Tag

permissions:
  contents: write
  packages: write

on:
  pull_request:
    types: [closed]
    branches:
      - main

concurrency:
  group: release-build-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Build and Tag
    if: ${{ github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/prep-') }}
    runs-on: ubuntu-latest
    env:
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 0

      - name: Run release build
        run: .github/workflows/build.sh release

      - name: Create and push release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="release-$(date -u +%Y%m%d%H%M)"

          if git rev-parse "${TAG}" >/dev/null 2>&1 || gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Release tag already exists: ${TAG}" >&2
            exit 1
          fi

          git tag "${TAG}" "${MERGE_SHA}"
          git push origin "${TAG}"
